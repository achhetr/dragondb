name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start integration databases
        run: npm run integration:up

      - name: Run integration tests in docker
        run: npm run test:integration:docker

      - name: Stop integration environment
        if: always()
        run: npm run integration:down
