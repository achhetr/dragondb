name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  integration-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saiyandb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saiyandb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        env:
          PG_TEST_URL_PRIMARY: postgres://postgres:postgres@localhost:5432/saiyandb
          PG_TEST_URL_FAILOVER: postgres://postgres:postgres@localhost:5432/saiyandb
        run: npm run test:integration
