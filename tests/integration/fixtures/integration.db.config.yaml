defaultDbType: pg
queryTimeoutMs: 5000
healthcheckTimeoutMs: 3000

failover:
  enabled: true
  connectionStrings: FAILOVER_DB_URLS

providers:
  - name: primary-real
    role: primary
    provider: aws
    dbType: pg
    env:
      connectionString: PRIMARY_DB_URL

  - name: failover-1-real
    role: failover
    provider: gcp
    dbType: pg
    enabled: true

  - name: failover-2-real
    role: failover
    provider: azure
    dbType: pg
    enabled: true
